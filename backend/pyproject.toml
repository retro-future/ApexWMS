[project]
name = "apexwms"
dynamic = ["version"]
description = "ApexWMS backend — FastAPI, Clean Architecture, database-per-tenant"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "dishka>=1.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "tzdata>=2025.1",
    # Pure Python, no system libraries — WeasyPrint would need Cairo and
    # Pango, which is a build problem on Windows and in a slim container.
    "fpdf2>=2.8",
    "python-barcode>=0.16.1",
    "loguru>=0.7",
]

[project.scripts]
apexwms = "infrastructure.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "faker>=33.1",
    "ruff>=0.9",
    # Pinned below 0.0.64, which shipped without a win_amd64 wheel. ty is
    # pre-1.0 and its diagnostics move between releases, so bump it
    # deliberately rather than floating.
    "ty>=0.0.63,<0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/application", "src/infrastructure", "src/presentation", "src/di"]
include = ["src/main.py", "src/version.py"]
sources = ["src"]
artifacts = [
    "src/application/localization/messages/*.toml",
    "src/infrastructure/documents/fonts/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 8 rather than one-per-core: the integration suite is Postgres-bound, and
# more workers just add connection pressure. `loadfile` keeps a test file's
# tenant churn on one worker, which halves the wall clock. `-n 0` runs
# single-process for debugging.
addopts = "-n 8 --dist loadfile"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The MasterSession/TenantSession NewTypes and the application ports are
# guardrails only a type checker can enforce — ruff does not type-check, so
# without this they are documentation. `uv run ty check` is a CI gate.
[tool.ty.environment]
root = ["src"]
python = "../.venv"

# tests/ is deliberately excluded for now: the domain suites assert that
# invalid calls are rejected (Money.from_major(10.5, ...)), and those lines
# carry mypy-style `# type: ignore[arg-type]` codes ty does not recognise.
[tool.ty.src]
include = ["src"]
