# Message catalog — English (also the fallback for any key a locale is missing).
# [errors] is keyed by an exception's `code`; [documents] by a renderer literal.

# Only genuinely context-free errors live here. Errors whose message carries
# a document number, an id, an email, or a computed reason are migrated to
# structured params in a later phase and fall back to their own message until
# then.
[errors]
authentication = "You are not signed in."
authorization = "You do not have permission for this action."
invalid_credentials = "Wrong email or password."
invalid_token = "Your session is no longer valid. Sign in again."
tenant_not_active = "This store is not active."
last_owner = "A store must keep at least one Owner."
unit_not_sellable = "IMEI {imei} is {status} and cannot be sold."
wrong_location = "IMEI {imei} is held at another location; {number} sells from its own."
insufficient_stock = "This location holds {on_hand} of {sku}; {number} would sell {wanted}. There is no partial fulfilment."

[documents]
invoice_title = "Invoice"
purchase_order_title = "Purchase Order"
supplier_return_title = "Supplier Return"
col_item = "Item"
col_qty = "Qty"
col_price = "Price"
col_total = "Total"
col_unit_cost = "Unit cost"
col_imei = "IMEI"
confirmed_at = "Confirmed {timestamp}"
total_for_currency = "Total ({currency})  {amount}"
cancelled = "CANCELLED: {reason}"
no_reason_given = "no reason given"
detail_supplier = "Supplier"
detail_location = "Location"
detail_from = "From"
detail_reason = "Reason"
