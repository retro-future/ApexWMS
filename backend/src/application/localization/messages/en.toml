# Message catalog — English (also the fallback for any key a locale is missing).
# [errors] is keyed by an exception's `message_key` (its `code`, or the
# explicit `key=` a raise site passes); [documents] by a renderer literal;
# [nouns] by the `subject_key` an error carries. A raise site the catalog
# does not cover falls back to the exception's own English message; the
# remaining gaps are deep domain-construction invariants that valid API
# input does not reach.
