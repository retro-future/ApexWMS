services:
  postgres:
    image: postgres:16-alpine
    # Local dev and test only. Durability is off on purpose: the suite creates
    # a database per test, and crash safety is not worth the fsync cost here.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
    environment:
      POSTGRES_USER: apexwms
      POSTGRES_PASSWORD: apexwms
      POSTGRES_DB: apexwms_master
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexwms -d apexwms_master"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
