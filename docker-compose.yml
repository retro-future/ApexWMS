services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apexwms
      POSTGRES_PASSWORD: apexwms
      POSTGRES_DB: apexwms_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexwms -d apexwms_control"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
